<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h3>library</h3>
        </header>
        <main>
            <!-- 검색 -->
            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search" name="search" size="15" placeholder="책이름을 검색하시오" />
            </div>
            <!-- 오늘의 책 -->
            <div class="section">
                <h2>Book of the day</h2>
                <div class="section-list">
                    <div class="section-image"><img class="book-picture" src="images/buddha.jpg" alt="부처의 감정 수업"></div>
                    <div class="section-actions">
                        <p>부처의 감정 수업</p>
                        <span>자현</span>
                        <div class="section-but">
                            <button class="preview">미리 보기</button>
                            <button class="comment">댓글 달기</button>
                        </div>
                        <div class="section-icon">
                            <span class="bell-circle">
                                <i class="fa-solid fa-bell"></i>
                            </span>
                            <button class="borrow">대여 신청</button>
                        </div>
                    </div>
                </div>    
            </div>
            <!-- 베스트 책 추천 -->
             <h2>a recommended book</h2>
            <div class="slider">
                <button class="prev"><i class="fa-solid fa-chevron-left"></i></button>
                    <div class="slider-image">
                        <!--이미지 넣을 공간-->
                        <img class="book-picture" src="images/book1.jpg" alt="한국사 이상현상 연구원"/>
                        <img class="book-picture" src="images/book2.jpg" alt="니체의 초월자"/>
                        <img class="book-picture" src="images/book3.jpg" alt="수족관"/>
                        <img class="book-picture" src="images/book4.jpg" alt="오디세이아"/>
                        <img class="book-picture" src="images/book5.jpg" alt="그랬다고 적었다"/>
                        <img class="book-picture" src="images/book6.jpg" alt="LIFE IS NOT SHORT"/>
                    </div>
                <button class="next"><i class="fa-solid fa-chevron-right"></i></button>
            </div> 
        </main>
        <footer>
            <h2>Popular Authorsk</h2>
            <div class="footer-author">
                <img class="figure-picture" src="images/jahyun.jpg" alt="jahyun"/>
                    <div class="footer-text">
                    <p>감정을 마주하는 이야기<br>‘마음의 길잡이’</p>
                    <span>『부처의 감정수업』을 통해 자현은 <br>우리가 일상에서 마주하는<br>감정을 들여다보고, 마음을 이해하는<br>새로운 시선을 전한다.</span>
                </div>
            </div>
            
        </footer>
    </div>
    <script src="https://kit.fontawesome.com/ac1501784d.js" crossorigin="anonymous"></script>
</body>
</html>
